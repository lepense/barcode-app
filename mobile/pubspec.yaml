name: barcode_app
description: "Barcode loyalty card manager with cloud sync and premium designs."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2

  # Auth providers
  google_sign_in: ^7.2.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^17.1.0

  # Local database
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.6.0+eol

  # Barcode
  mobile_scanner: ^7.2.0
  barcode_widget: ^2.0.4

  # Security
  flutter_secure_storage: ^10.0.0
  encrypt: ^5.0.3
  pointycastle: ^3.9.1

  # Utils
  uuid: ^4.5.3
  intl: ^0.20.2
  connectivity_plus: ^7.0.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # In-app purchases
  in_app_purchase: ^3.2.0

  # HTTP for Cloud Function calls
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.26.0
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3
  mockito: ^5.4.6

flutter:
  uses-material-design: true
